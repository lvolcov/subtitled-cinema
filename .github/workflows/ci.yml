name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4
      - name: Parser + pipeline tests
        run: python -m unittest tests.test_parse -v

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - name: Frontend UI tests
        run: python -m unittest tests.test_ui -v
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/screenshots/*.png
