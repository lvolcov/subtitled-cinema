name: Build & deploy site

# Fully automatic refresh: every 6 hours, on manual trigger, and on push.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# never run two deploys at once
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install beautifulsoup4

      - name: Fetch source listings
        run: python -m build.fetch_pages

      - name: Resolve movie posters (refresh cache)
        run: python -m build.posters
        continue-on-error: true      # posters are best-effort; never block a deploy

      - name: Resolve Wikipedia poster fallbacks
        run: python -m build.posters_wiki
        continue-on-error: true

      - name: Resolve direct IMDb ids (via Wikidata)
        run: python -m build.imdb
        continue-on-error: true      # falls back to search links; never block a deploy

      - name: Cache per-venue coordinates (YLC locator feed)
        run: python -m build.coords_feed
        continue-on-error: true      # per-venue coords for "nearest"; never block a deploy

      - name: Geocode venues by postcode (fallback for "nearest")
        run: python -m build.geocode
        continue-on-error: true      # falls back to curated coords; never block a deploy

      - name: Geocode remaining venues by name (Nominatim, last resort)
        run: python -m build.geocode_name
        continue-on-error: true      # cached; only new coordless venues hit the network

      - name: Build data.json
        run: python -m build.build_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
